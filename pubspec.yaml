name: hishab_khata_bd
description: "Hishab Khata BD - Offline-first personal & family finance app in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase Core & Auth
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  google_sign_in: ^6.2.1

  # Local Database & Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Routing & Navigation
  go_router: ^13.2.0

  # Date, Calendar & Timezone
  intl: ^0.20.3
  timezone: ^0.9.2

  # UI, Charts & Utils
  fl_chart: ^0.66.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.5
  share_plus: ^8.0.2
  printing: ^5.13.1
  pdf: ^3.10.8

  # Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
